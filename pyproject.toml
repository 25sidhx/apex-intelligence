[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-embedded"
version = "1.0.0"
description = "Autonomous Tech Intelligence & Embedded/Drone Engineering System"
readme = "README.md"
authors = [{ name = "Siddhant Rahate (25sidhx)" }]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "feedparser>=6.0.0",
    "requests>=2.30.0",
    "GitPython>=3.1.0",
]

[project.scripts]
apex = "apex.cli:app"
